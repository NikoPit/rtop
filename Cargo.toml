[package]
name = "rxtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal process resource manager for the terminal"
repository = "https://github.com/NikoPit/rxtop"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
